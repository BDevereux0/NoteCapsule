# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Backend CI with Maven


#This is where I configure when the CI tests run.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'compose.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'compose.yaml'

env:
  DB_URL: jdbc:mysql://localhost:3306/notecapsule
  DB_USERNAME: testuser
  DB_PASSWORD: testpassword

#This lets Github write to my repo. Purpose: Enables writing dependency graph (below)
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: notecapsule
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10



    steps:
    # Uses run actions which are executable code blocks.
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      #With are the inputs/configs to actions
      with:
        java-version: '21'
        distribution: 'temurin'
        #This will cache my dependencies.
        cache: maven
    - name: Build with Maven
      # I changed this from mvn -B because I'm using the wrapper.
      # Run executes a shell command on the GitHub runner
      run: ./mvnw -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      #Below will send a POST request to github so my dependency graph will be stored. Initially I got a 403
      #Updating permissions in the .yaml...
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
